name: TidyTrail
options:
  bundleIdPrefix: com.sunilgentyala
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "4"
packages:
  TidyTrailCore:
    path: .
targets:
  TidyTrail:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/TidyTrail
      - path: Sources/TidyTrailUI
    dependencies:
      - package: TidyTrailCore
        product: TidyTrailCore
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunilgentyala.tidytrail
        PRODUCT_NAME: TidyTrail
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TidyTrailUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/TidyTrailCoreTests
    dependencies:
      - package: TidyTrailCore
        product: TidyTrailCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  TidyTrailMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/TidyTrailMac
      - path: Sources/TidyTrailUI
    dependencies:
      - package: TidyTrailCore
        product: TidyTrailCore
    info:
      path: Generated/Info-Mac.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunilgentyala.tidytrail.mac
        PRODUCT_NAME: TidyTrail
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/TidyTrailMac/TidyTrailMac.entitlements
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: true
        MACOSX_DEPLOYMENT_TARGET: "13.0"

schemes:
  TidyTrail:
    build:
      targets:
        TidyTrail: all
        TidyTrailUnitTests: [test]
    test:
      targets:
        - TidyTrailUnitTests

  TidyTrailMac:
    build:
      targets:
        TidyTrailMac: all
