name: TidyTrail
options:
  bundleIdPrefix: com.sunilgentyala
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  TidyTrailCore:
    path: .
targets:
  TidyTrail:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/TidyTrail
    dependencies:
      - package: TidyTrailCore
        product: TidyTrailCore
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunilgentyala.tidytrail
        PRODUCT_NAME: TidyTrail
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TidyTrailUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/TidyTrailCoreTests
    dependencies:
      - package: TidyTrailCore
        product: TidyTrailCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  TidyTrail:
    build:
      targets:
        TidyTrail: all
        TidyTrailUnitTests: [test]
    test:
      targets:
        - TidyTrailUnitTests
