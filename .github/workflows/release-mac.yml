name: Build Mac App (.dmg)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to attach the .dmg to (e.g. v1.1.0). Leave blank to just produce a downloadable build artifact."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build, sign, and package TidyTrail.app as a .dmg
    runs-on: macos-14
    permissions:
      contents: write # attach the .dmg to a release
      id-token: write # sign the build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Real Developer ID signing + notarization (so macOS's Gatekeeper never
      # warns on download) needs a paid Apple Developer account's Developer
      # ID Application certificate - only the account owner can create that.
      # See docs/MAC_APP_DISTRIBUTION.md. Until those secrets exist, this ad-hoc
      # signature still satisfies App Sandbox/entitlements for a locally-run
      # or right-click-Open'd copy - it just won't pass Gatekeeper silently.
      - name: Build Release .app (ad-hoc signed)
        run: |
          xcodebuild build \
            -project TidyTrail.xcodeproj \
            -scheme TidyTrailMac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Check for Developer ID secrets
        id: check_secrets
        env:
          MAC_DEVELOPER_ID_CERT_P12: ${{ secrets.MAC_DEVELOPER_ID_CERT_P12 }}
        run: echo "configured=${{ secrets.MAC_DEVELOPER_ID_CERT_P12 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple (only if Developer ID secrets are configured)
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          MAC_DEVELOPER_ID_CERT_P12: ${{ secrets.MAC_DEVELOPER_ID_CERT_P12 }}
          MAC_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERT_PASSWORD }}
          MAC_DEVELOPER_ID_IDENTITY: ${{ secrets.MAC_DEVELOPER_ID_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/tidytrail-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAC_DEVELOPER_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MAC_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | sed 's/"//g')"

          APP_PATH="build/Build/Products/Release/TidyTrail.app"
          codesign --force --deep --options runtime \
            --entitlements Sources/TidyTrailMac/TidyTrailMac.entitlements \
            --sign "$MAC_DEVELOPER_ID_IDENTITY" --keychain "$KEYCHAIN_PATH" "$APP_PATH"

          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/TidyTrail.zip"
          xcrun notarytool submit "$RUNNER_TEMP/TidyTrail.zip" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$APP_PATH"

      - name: Package as .dmg
        run: |
          APP_PATH="build/Build/Products/Release/TidyTrail.app"
          DMG_STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$DMG_STAGING"
          cp -R "$APP_PATH" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "TidyTrail" -srcfolder "$DMG_STAGING" -ov -format UDZO TidyTrail.dmg

      # Checksum + signed SLSA provenance, so an installer can verify the
      # download (`shasum -a 256 -c TidyTrail.dmg.sha256` and
      # `gh attestation verify TidyTrail.dmg --repo sunilgentyala/TidyTrail`).
      - name: Generate SHA-256 checksum
        run: shasum -a 256 TidyTrail.dmg | tee TidyTrail.dmg.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: TidyTrail.dmg

      - name: Upload .dmg as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TidyTrail-dmg
          path: |
            TidyTrail.dmg
            TidyTrail.dmg.sha256

      - name: Attach .dmg to a GitHub release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" TidyTrail.dmg TidyTrail.dmg.sha256 --clobber
